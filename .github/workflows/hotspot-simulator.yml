name: Hotspot Simulator Android Build
on:
  push:
    branches: [feature/hotspot-simulator]
    paths: ['hotspot-simulator/**', '.github/workflows/hotspot-simulator.yml']
  pull_request:
    paths: ['hotspot-simulator/**', '.github/workflows/hotspot-simulator.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Assemble debug APK
        run: gradle -p hotspot-simulator :app:assembleDebug
