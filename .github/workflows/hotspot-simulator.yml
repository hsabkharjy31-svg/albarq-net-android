name: Hotspot Simulator Android Build # live-preview auto-open validation
on:
  push:
    branches: [feature/hotspot-simulator]
    paths: ['hotspot-simulator/**', '.github/workflows/hotspot-simulator.yml']
  pull_request:
    paths: ['hotspot-simulator/**', '.github/workflows/hotspot-simulator.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test templates, lint and assemble debug APK
        run: gradle -p hotspot-simulator :app:testDebugUnitTest :app:lint :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: albarq-hotspot-simulator-debug
          path: hotspot-simulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
