name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" SDK package. Install only platform-tools.
          packages: 'platform-tools'
      - name: Build, test, and lint
        run: chmod +x ./gradlew && ./gradlew assembleDebug testDebugUnitTest lint
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: albarq-net-debug-apk, path: app/build/outputs/apk/debug/*.apk }
